spring.application.name=command-service

spring.datasource.url=jdbc:postgresql://localhost:3334/beautique
spring.datasource.username=beautique
spring.datasource.password=beautique
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.username=password


